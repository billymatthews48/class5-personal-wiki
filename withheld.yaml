    reason: *third_party
  - path: "raw/cambridge/Mott Project/Mott's old project ppt.pptx"
    what: "Slides from an earlier (2018) student team's project for the same client."
    reason: *third_party
  - path: "raw/cambridge/Mott Project/Focus Group Transcripts.docx"
    what: "Notes of what focus-group participants said."
    reason: *other_people
  - path: "raw/cambridge/Mott Project/Interview answers.docx"
