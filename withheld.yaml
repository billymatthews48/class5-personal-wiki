# Original files that stay on my machine and are NOT published in the repository.
# Each is also listed in .gitignore. `wiki ingest` writes a stub page for each one under
# vault/withheld/, and notes link to the stub, so no source link is dead in a clone of the repo.
# The files are still indexed locally, so search and ask can use and cite them on my machine.

third_party: &third_party "Third-party material that I do not have the right to republish."
other_people: &other_people "Contains other people's words from interviews and focus groups, recorded for a client project."

withheld:
  - path: "raw/cambridge/Exams/MS4 Finance and accounting/Lectures/Dauderis, H. and Annand, D. (2014) Introduction to Financial Accounting.pdf"
    what: "Textbook: Dauderis, H. and Annand, D. (2014), Introduction to Financial Accounting."
    reason: *third_party
  - path: "raw/cambridge/Electives/Strategic management/Supervisions & assessment/Assessment/The future of hospitality - Why 2021 is the year of the hybrid.pdf"
    what: "Industry report: The future of hospitality - Why 2021 is the year of the hybrid."
    reason: *third_party
  - path: "raw/cambridge/Electives/Macroeconomics/Syllabus and reading list.pdf"
    what: "Course syllabus and reading list for the Macroeconomics elective (not written by me)."
    reason: *third_party
  - path: "raw/cambridge/Exams/MS2 Quantitative Methods/normal distribution table.pdf"
    what: "A normal distribution table (reference material, not written by me)."
    reason: *third_party
  - path: "raw/cambridge/First week/MS5 Operations Management/Lectures/Lean Terminology.pdf"
