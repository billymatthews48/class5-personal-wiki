[project]
name = "personal-wiki"
version = "0.1.0"
description = "Local academic wiki CLI: chat, ask, search and ingest over Obsidian notes with local Gemma"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "rank-bm25>=0.2.2",
  "numpy>=2.0",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "python-pptx>=1.0",
  "pyyaml>=6.0",
  "psutil>=6.0",
]

[project.scripts]
wiki = "wiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wiki", "wiki.ingest"]
