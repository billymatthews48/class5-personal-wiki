# Which raw files feed which wiki note. One coherent subject per note; a subject can draw on
# several courses (e.g. Microeconomics = Cambridge MS3 + MBA economics work).
#
#   key:     stable machine id for the subject (kept in note properties, never in filenames)
#   title:   the note's filename and H1, 2-6 words. Gemma writes the note body; the title is
#            fixed here so re-ingestion can never rename a note back to something machine-like.
#   folder:  topic folder under vault/wiki/
#   sources: glob patterns relative to vault/ (first match wins, top to bottom)
#
# Raw files matching no pattern are reported by `wiki ingest` and indexed for search anyway.

subjects:
  - key: microeconomics
    title: Microeconomics
    folder: Economics and Strategy
    sources:
      - raw/cambridge/Week 2/MS3 Micro economics/**
      - raw/cambridge/Week 2/oEcon questions/**
      - raw/mba/Group 112 Economics Memo.docx
      - raw/mba/Example in the Wild 3.docx

